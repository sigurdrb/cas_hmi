<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS Pen Overview</title>
<style>
  /* Palette: dataviz reference instance, categorical slots 1-3 (blue, orange,
     aqua) -- the subset documented as validating all-pairs in both modes.
     Dark is selected, not an automatic flip. */
  :root {
    color-scheme: light;
    --surface-0:      #f4f3f0;
    --surface-1:      #fcfcfb;
    --border:         #dedcd6;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #7a7873;
    --grid:           #e7e5df;
    --series-1:       #2a78d6;
    --series-2:       #eb6834;
    --series-3:       #1baf7a;
    --good:           #008300;
    --critical:       #e34948;
    --warning:        #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0:      #111110;
      --surface-1:      #1a1a19;
      --border:         #383835;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8b8a82;
      --grid:           #2a2a28;
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --good:           #008300;
      --critical:       #e66767;
      --warning:        #c98500;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0:      #111110;
    --surface-1:      #1a1a19;
    --border:         #383835;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8b8a82;
    --grid:           #2a2a28;
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --good:           #008300;
    --critical:       #e66767;
    --warning:        #c98500;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 4px 10px;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  button:hover { border-color: var(--text-muted); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .dot.ok { background: var(--good); }
  .dot.bad { background: var(--critical); }

  .tiles {
    display: grid; gap: 10px; margin-bottom: 14px;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .tile .name { color: var(--text-secondary); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .tile .unit { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
  .tile .note { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .pill {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
    border: 1px solid var(--border); color: var(--text-secondary);
  }
  .pill.run { color: var(--good); border-color: var(--good); }
  .pill.stop { color: var(--text-muted); }
  .pill.fault { color: var(--critical); border-color: var(--critical); }

  .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 12px 8px;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 2px;
  }
  .card .axis-note { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 0; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  canvas { display: block; width: 100%; height: 190px; touch-action: none; }
  .tall canvas { height: 230px; }

  table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 500; }
  .hidden { display: none; }

  .banner {
    background: var(--surface-1); border: 1px solid var(--critical);
    border-left-width: 3px; border-radius: 6px;
    padding: 8px 12px; margin-bottom: 12px; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>CAS — Pen Overview</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
  <span class="spacer"></span>
  <button id="tableBtn">Show table</button>
  <button id="themeBtn">Theme</button>
</header>

<div id="banner" class="banner hidden"></div>

<div class="tiles" id="tiles"></div>

<div class="grid2">
  <div class="card">
    <h2>Water level</h2>
    <div class="axis-note" id="note-levels"></div>
    <canvas id="c-levels"></canvas>
    <div class="legend" id="l-levels"></div>
  </div>

  <div class="card">
    <h2>Over-height inside pen</h2>
    <div class="axis-note" id="note-over"></div>
    <canvas id="c-over"></canvas>
    <div class="legend" id="l-over"></div>
  </div>

  <div class="card">
    <h2>Inlet pump speed setpoint</h2>
    <div class="axis-note" id="note-pumps"></div>
    <canvas id="c-pumps"></canvas>
    <div class="legend" id="l-pumps"></div>
  </div>

  <div class="card">
    <h2>Oxygen control valve</h2>
    <div class="axis-note" id="note-valves"></div>
    <canvas id="c-valves"></canvas>
    <div class="legend" id="l-valves"></div>
  </div>
</div>

<div class="card tall">
  <h2>Pen oxygen concentration</h2>
  <div class="axis-note" id="note-o2"></div>
  <canvas id="c-o2"></canvas>
  <div class="legend" id="l-o2"></div>
</div>

<div class="card hidden" id="tableCard">
  <h2>Current values</h2>
  <table id="table"></table>
</div>

<script>
"use strict";

// ---------------------------------------------------------------- state ----
let META = null;
let SNAP = null;
const CH = {};                 // chart id -> {canvas, series, unit, hover}

const css = (name) => getComputedStyle(document.documentElement)
  .getPropertyValue(name).trim();

// -------------------------------------------------------------- helpers ----
function fmt(v, digits) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return Number(v).toFixed(digits);
}

function avg(values) {
  const ok = values.filter((v) => typeof v === "number" && !Number.isNaN(v));
  return ok.length ? ok.reduce((a, b) => a + b, 0) / ok.length : null;
}

function niceTicks(lo, hi, count) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const start = Math.ceil(lo / step) * step;
  const out = [];
  for (let v = start; v <= hi + step * 1e-9; v += step) out.push(v);
  return out;
}

// One unit per axis: the window picks it, so a single chart never mixes
// "-88m" with "-5.8h". Pass the same window when formatting tooltip ages.
function ago(seconds, window_s) {
  const w = window_s === undefined ? seconds : window_s;
  if (w < 180) return Math.round(seconds) + "s";
  if (w < 7200) return Math.round(seconds / 60) + "m";
  return (seconds / 3600).toFixed(1) + "h";
}

// ---------------------------------------------------------------- chart ----
// One reusable line chart. Single y-axis by construction: a chart is given one
// unit, and every series on it is in that unit.
function drawChart(spec) {
  const { canvas, rows, series, unit, digits, window_s } = spec;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const padL = 46, padR = 10, padT = 8, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  if (!rows.length) {
    ctx.fillStyle = css("--text-muted");
    ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("waiting for data…", padL + plotW / 2, padT + plotH / 2);
    return;
  }

  const tNow = rows[rows.length - 1].t;
  const tMin = tNow - window_s;

  // y-range over every series on this chart
  let lo = Infinity, hi = -Infinity;
  for (const s of series) {
    for (const r of rows) {
      const v = s.get(r);
      if (typeof v === "number" && !Number.isNaN(v)) {
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
    }
  }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.12;
  lo -= pad; hi += pad;

  const X = (t) => padL + ((t - tMin) / (tNow - tMin || 1)) * plotW;
  const Y = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  // recessive grid + y labels
  ctx.strokeStyle = css("--grid");
  ctx.lineWidth = 1;
  ctx.fillStyle = css("--text-muted");
  ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (const tick of niceTicks(lo, hi, 4)) {
    const y = Math.round(Y(tick)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    ctx.fillText(fmt(tick, digits), padL - 6, y);
  }

  // x labels: how long ago
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let i = 0; i <= 4; i++) {
    const t = tMin + (tNow - tMin) * (i / 4);
    ctx.fillText(i === 4 ? "now" : "-" + ago(tNow - t, window_s), X(t), padT + plotH + 5);
  }

  // series, 2px lines
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  for (const s of series) {
    ctx.strokeStyle = css(s.color);
    if (s.dash) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
    ctx.beginPath();
    let pen = false;
    for (const r of rows) {
      const v = s.get(r);
      if (typeof v !== "number" || Number.isNaN(v)) { pen = false; continue; }
      const x = X(r.t), y = Y(v);
      if (!pen) { ctx.moveTo(x, y); pen = true; } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // direct label at the right-hand end of each series (<=4 series here)
  ctx.textAlign = "right";
  ctx.textBaseline = "bottom";
  ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
  for (const s of series) {
    const last = [...rows].reverse().find((r) => typeof s.get(r) === "number");
    if (!last) continue;
    // text wears ink, not the series color; the swatch in the legend carries identity
    ctx.fillStyle = css("--text-secondary");
    ctx.fillText(fmt(s.get(last), digits), padL + plotW, Y(s.get(last)) - 4);
  }

  // hover crosshair + tooltip
  const hv = spec.hover;
  if (hv && hv.x >= padL && hv.x <= padL + plotW) {
    const tHover = tMin + ((hv.x - padL) / plotW) * (tNow - tMin);
    let best = rows[0], bestD = Infinity;
    for (const r of rows) {
      const d = Math.abs(r.t - tHover);
      if (d < bestD) { bestD = d; best = r; }
    }
    const x = X(best.t);
    ctx.strokeStyle = css("--text-muted");
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
    ctx.setLineDash([]);

    const lines = series
      .filter((s) => typeof s.get(best) === "number")
      .map((s) => ({ label: s.label, text: fmt(s.get(best), digits) + " " + unit, color: s.color }));
    const boxW = 150, lineH = 15, boxH = 16 + lines.length * lineH;
    let bx = x + 10;
    if (bx + boxW > padL + plotW) bx = x - boxW - 10;
    const by = padT + 6;

    ctx.fillStyle = css("--surface-1");
    ctx.strokeStyle = css("--border");
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(bx, by, boxW, boxH, 6);
    ctx.fill(); ctx.stroke();

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = css("--text-muted");
    const age = ago(tNow - best.t, window_s);
    ctx.fillText(/^0(\.0)?[smh]$/.test(age) ? "now" : "-" + age, bx + 9, by + 10);
    lines.forEach((ln, i) => {
      const ly = by + 16 + i * lineH + 6;
      ctx.fillStyle = css(ln.color);
      ctx.beginPath(); ctx.roundRect(bx + 9, ly - 4, 8, 8, 2); ctx.fill();
      ctx.fillStyle = css("--text-secondary");
      ctx.fillText(ln.label, bx + 22, ly);
      ctx.fillStyle = css("--text-primary");
      ctx.textAlign = "right";
      ctx.fillText(ln.text, bx + boxW - 9, ly);
      ctx.textAlign = "left";
    });

    for (const s of series) {
      const v = s.get(best);
      if (typeof v !== "number") continue;
      ctx.fillStyle = css(s.color);
      ctx.strokeStyle = css("--surface-1");
      ctx.lineWidth = 2;                       // 2px surface ring on overlapping marks
      ctx.beginPath(); ctx.arc(x, Y(v), 4.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  }
}

function legendInto(el, series) {
  el.innerHTML = series.map((s) =>
    `<span><i class="swatch" style="background:${css(s.color)}"></i>${s.label}</span>`
  ).join("");
}

function register(id, series, unit, digits, windowKey) {
  const canvas = document.getElementById("c-" + id);
  CH[id] = { canvas, series, unit, digits, windowKey, hover: null };
  legendInto(document.getElementById("l-" + id), series);
  canvas.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    CH[id].hover = { x: e.clientX - r.left };
    render();
  });
  canvas.addEventListener("pointerleave", () => { CH[id].hover = null; render(); });
}

// --------------------------------------------------------------- series ----
const insideAvg  = (r) => avg([r.level_inside_1,  r.level_inside_2,  r.level_inside_3]);
const outsideAvg = (r) => avg([r.level_outside_1, r.level_outside_2, r.level_outside_3]);
const overAvg = (r) => {
  const i = insideAvg(r), o = outsideAvg(r);
  return (i === null || o === null) ? null : (i - o) * 100;   // m -> cm
};
// Pen.Status.PenOxygenLevel is the PID's process value but is never written in
// the project, so the average of the three Orbit 864 sensors inside the pen is
// what actually shows a number today.
const o2Avg = (r) => avg([r.o2_sensor_1, r.o2_sensor_2, r.o2_sensor_3]);

function buildCharts() {
  register("levels", [
    { label: "Inside (avg of 3)",  color: "--series-1", get: insideAvg },
    { label: "Outside (avg of 3)", color: "--series-2", get: outsideAvg },
  ], "m", 3, "fast");

  register("over", [
    { label: "From sensors (avg)", color: "--series-1", get: overAvg },
    { label: "Pen.Status.OverHeight", color: "--series-2", get: (r) => r.pen_overheight },
    { label: "Setpoint", color: "--series-3", dash: true, get: (r) => r.level_sp },
  ], "cm", 1, "fast");

  register("pumps", [
    { label: "Inlet 1", color: "--series-1", get: (r) => r.pump_sp_1 },
    { label: "Inlet 2", color: "--series-2", get: (r) => r.pump_sp_2 },
    { label: "Inlet 3", color: "--series-3", get: (r) => r.pump_sp_3 },
  ], "rpm", 1, "fast");

  register("valves", [
    { label: "Inlet 1", color: "--series-1", get: (r) => r.valve_1 },
    { label: "Inlet 2", color: "--series-2", get: (r) => r.valve_2 },
    { label: "Inlet 3", color: "--series-3", get: (r) => r.valve_3 },
  ], "%", 1, "fast");

  register("o2", [
    { label: "From sensors (avg of 3)", color: "--series-1", get: o2Avg },
    { label: "Pen.Status.PenOxygenLevel", color: "--series-2", get: (r) => r.pen_o2 },
    { label: "Setpoint", color: "--series-3", dash: true, get: (r) => r.o2_sp },
  ], "g/m³", 2, "slow");
}

// ---------------------------------------------------------------- tiles ----
function statePill(code) {
  const names = (META && META.pump_states) || [];
  const name = (typeof code === "number" && names[code]) ? names[code] : "—";
  let cls = "stop";
  if (name === "Remote" || name === "Starting") cls = "run";
  if (name === "Lockdown" || name === "Unavailable") cls = "fault";
  return `<span class="pill ${cls}">${name}</span>`;
}

function renderTiles() {
  const L = (SNAP && SNAP.latest) || {};
  const rowsFast = (SNAP && SNAP.fast) || [];
  const last = rowsFast.length ? rowsFast[rowsFast.length - 1] : {};
  const over = overAvg(last);

  let html = "";
  html += `<div class="tile"><div class="name">Pen oxygen (from sensors)</div>
    <div class="value">${fmt(o2Avg(L), 2)} <span class="unit">g/m³</span></div>
    <div class="note">setpoint ${fmt(L.o2_sp, 2)} g/m³</div></div>`;

  html += `<div class="tile"><div class="name">Over-height (from sensors)</div>
    <div class="value">${fmt(over, 1)} <span class="unit">cm</span></div>
    <div class="note">setpoint ${fmt(L.level_sp, 1)} cm</div></div>`;

  for (let n = 1; n <= (META ? META.n_inlets : 3); n++) {
    html += `<div class="tile"><div class="name">Inlet ${n}</div>
      <div class="value">${fmt(L["pump_sp_" + n], 0)} <span class="unit">rpm</span></div>
      <div class="note">${statePill(L["pump_state_" + n])}
        &nbsp;valve ${fmt(L["valve_" + n], 0)} %
        &nbsp;O₂ ${fmt(L["oxyflow_" + n], 1)} kg/h</div></div>`;
  }
  document.getElementById("tiles").innerHTML = html;
}

function renderTable() {
  const L = (SNAP && SNAP.latest) || {};
  const labels = (META && META.labels) || {};
  const units = (META && META.units) || {};
  const keys = Object.keys(labels);
  let html = "<tr><th>Signal</th><th>Value</th><th>Unit</th></tr>";
  for (const k of keys) {
    const v = L[k];
    const shown = (k.startsWith("pump_state_"))
      ? ((META.pump_states[v] !== undefined) ? META.pump_states[v] : "—")
      : (typeof v === "number" ? fmt(v, 2) : (v === null || v === undefined ? "—" : String(v)));
    html += `<tr><td>${labels[k]}</td><td>${shown}</td><td>${units[k] || ""}</td></tr>`;
  }
  document.getElementById("table").innerHTML = html;
}

// --------------------------------------------------------------- render ----
function render() {
  if (!SNAP) return;
  for (const id of Object.keys(CH)) {
    const c = CH[id];
    const rows = c.windowKey === "slow" ? SNAP.slow : SNAP.fast;
    const win = c.windowKey === "slow" ? META.slow_window_s : META.fast_window_s;
    drawChart({
      canvas: c.canvas, rows, series: c.series, unit: c.unit,
      digits: c.digits, window_s: win, hover: c.hover,
    });
    legendInto(document.getElementById("l-" + id), c.series);
  }
  renderTiles();
  if (!document.getElementById("tableCard").classList.contains("hidden")) renderTable();
}

function renderNotes() {
  const f = META.fast_window_s, s = META.slow_window_s;
  const fastNote = `last ${f} s — 10 × the level time constant (${META.tau_level_s} s)`;
  const slowNote = `last ${(s / 3600).toFixed(1)} h — 10 × the oxygen time constant `
                 + `(${(META.tau_oxygen_s / 60).toFixed(0)} min)`;
  document.getElementById("note-levels").textContent = fastNote;
  document.getElementById("note-over").textContent   = fastNote;
  document.getElementById("note-pumps").textContent  = fastNote;
  document.getElementById("note-valves").textContent = fastNote;
  document.getElementById("note-o2").textContent     = slowNote;
}

async function poll() {
  try {
    const res = await fetch("/api/snapshot", { cache: "no-store" });
    SNAP = await res.json();
    if (!META) { META = SNAP.meta; buildCharts(); renderNotes(); }

    const dot = document.getElementById("dot");
    const conn = document.getElementById("conn");
    dot.className = "dot " + (SNAP.connected ? "ok" : "bad");
    conn.textContent = SNAP.connected ? "connected" : "disconnected";

    const banner = document.getElementById("banner");
    if (SNAP.error) { banner.textContent = SNAP.error; banner.classList.remove("hidden"); }
    else banner.classList.add("hidden");

    render();
  } catch (e) {
    document.getElementById("dot").className = "dot bad";
    document.getElementById("conn").textContent = "HMI server unreachable";
  }
}

// ---------------------------------------------------------------- setup ----
document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("cashmi-theme", next); } catch (e) { /* private mode */ }
  render();
});
try {
  const saved = localStorage.getItem("cashmi-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) { /* ignore */ }

document.getElementById("tableBtn").addEventListener("click", () => {
  const card = document.getElementById("tableCard");
  card.classList.toggle("hidden");
  document.getElementById("tableBtn").textContent =
    card.classList.contains("hidden") ? "Show table" : "Hide table";
  render();
});

window.addEventListener("resize", render);
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
